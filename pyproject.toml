[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "car-rental-api"
version = "1.0.0"
description = "A FastAPI-based Car Rental Management System with admin and customer features"
readme = "README.md"
requires-python = ">=3.8"
authors = [
    {name = "Fatpanda79", email = "your-email@example.com"}
]
keywords = ["fastapi", "car-rental", "api", "booking"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "fastapi>=0.95.0",
    "uvicorn[standard]>=0.21.0",
    "pydantic>=1.10.0",
    "requests>=2.28.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "black>=22.0",
    "flake8>=4.0",
]

[project.urls]
Homepage = "https://github.com/Fatpanda79/pyproject"
Repository = "https://github.com/Fatpanda79/pyproject"
Issues = "https://github.com/Fatpanda79/pyproject/issues"

[tool.setuptools]
packages = ["car_rental_api"]

[tool.black]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
